name: Tauri Main Release

on:
    push:
        branches:
            - main
        tags:
            - 'v*'

permissions:
    contents: write

concurrency:
    group: tauri-main-release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build ${{ matrix.platform }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                      artifact_name: tauri-linux
                    - os: windows-latest
                      platform: windows
                      artifact_name: tauri-windows
                    - os: macos-latest
                      platform: macos
                      artifact_name: tauri-macos

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Use Node.js 24.x
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install Linux dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential \
                    curl \
                    file \
                    libayatana-appindicator3-dev \
                    libgtk-3-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    libxdo-dev \
                    patchelf \
                    wget

            - name: Install dependencies
              run: npm ci

            - name: Build Tauri desktop app
              run: npm run tauri:build

            - name: Collect release assets
              shell: pwsh
              run: |
                  $bundleDir = Join-Path $PWD "src-tauri/target/release/bundle"
                  $artifactDir = Join-Path $PWD "release-artifacts/${{ matrix.artifact_name }}"
                  $patterns = @("*.AppImage", "*.deb", "*.rpm", "*.msi", "*.exe", "*.dmg", "*.app.tar.gz", "*.sig", "latest*.json")

                  New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

                  $files = Get-ChildItem -Path $bundleDir -Recurse -File | Where-Object {
                    $name = $_.Name
                    foreach ($pattern in $patterns) {
                      if ($name -like $pattern) {
                        return $true
                      }
                    }
                    return $false
                  }

                  if (-not $files -or $files.Count -eq 0) {
                    throw "No Tauri release assets found under $bundleDir"
                  }

                  foreach ($file in $files) {
                    Copy-Item -Path $file.FullName -Destination (Join-Path $artifactDir $file.Name) -Force
                  }

            - name: Upload workflow artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: release-artifacts/${{ matrix.artifact_name }}
                  if-no-files-found: error

    publish:
        name: Publish rolling prerelease
        runs-on: ubuntu-latest
        needs: build
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Download workflow artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: tauri-*
                  path: release-artifacts

            - name: Publish rolling prerelease
              shell: bash
              run: |
                  set -euo pipefail

                  mapfile -d '' assets < <(find release-artifacts -type f -print0)

                  if [ "${#assets[@]}" -eq 0 ]; then
                    echo "No release assets were downloaded."
                    exit 1
                  fi

                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                    release_tag="${GITHUB_REF_NAME}"
                  else
                    release_tag="desktop-main"

                    if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
                      gh api \
                        --method PATCH \
                        "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                        -f sha="${GITHUB_SHA}" \
                        -F force=true >/dev/null
                    else
                      gh api \
                        --method POST \
                        "repos/${GITHUB_REPOSITORY}/git/refs" \
                        -f ref="refs/tags/${release_tag}" \
                        -f sha="${GITHUB_SHA}" >/dev/null
                    fi

                    if gh release view "${release_tag}" >/dev/null 2>&1; then
                      gh release edit "${release_tag}" \
                        --title "Desktop Main Build" \
                        --notes "Latest ChartDB desktop build from the main branch." \
                        --target "${GITHUB_SHA}" \
                        --prerelease
                    else
                      gh release create "${release_tag}" \
                        --title "Desktop Main Build" \
                        --notes "Latest ChartDB desktop build from the main branch." \
                        --target "${GITHUB_SHA}" \
                        --prerelease
                    fi
                  fi

                  if [ "${GITHUB_REF_TYPE}" = "tag" ] && ! gh release view "${release_tag}" >/dev/null 2>&1; then
                    gh release create "${release_tag}" \
                      --title "${release_tag}" \
                      --notes "Desktop binaries for ${release_tag}."
                  fi

                  gh release upload "${release_tag}" "${assets[@]}" --clobber
